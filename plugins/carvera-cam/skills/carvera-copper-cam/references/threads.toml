# How SchusterLab pre-drills and thread-mills tapped holes on the Carvera.
#
# carvera_cam.py reads this file every time it builds toolpaths, so editing a
# value here changes the next build. Lengths are in mm.
#
# The lab models a tapped hole with Fusion's Hole command: Tapped, ISO metric,
# class 6H, threads not modeled. That leaves a plain hole at the thread's minor
# diameter (`modelled_hole`), which the generator recognizes by diameter.
#
# Each hole is pre-drilled slightly oversize (M4: drilled, then bored to size
# with the end mill), then thread-milled. Feeds and speeds come from each
# tool's "Copper" preset, not from here:
#   drills          10000 rpm, plunge 50 mm/min, retract 500 mm/min
#   end mill        6000 rpm, 200 mm/min
#   thread mills    10000 rpm; M2 100, M2.5 150, M3 200, M4 200 mm/min
#
# Sources (Fusion projects; the newest settings win where they differ):
#   M2    2026-01-06_smpm-sample-package-6port: sample pucks, lids, hangers,
#         kiutra-beam, bobbin-bottom, aluminum-can-lid (17 parts)
#   M2.5  copper-can-lid-6port (blind holes, both setups)
#   M3    Default Project: 2026-04-12_holes-for-copper-finger-1 and -2, and an
#         Untitled design (the only M3 work; the two differ, see [M3])
#   M4    hanger-support-for-chris, hanger-support-for-bluefors-sd-vertical,
#         eccosorb-clamp-6port, and Default Project: 2026-07-31_amir-puck-finger


# ---------------------------------------------------------------- every size

[drill]
# Fusion's "chip breaking - partial retract" cycle
cycle = "chip-breaking"
peck = 0.1                # pecking depth
accumulated_peck = 1.0    # accumulated pecking depth, after which the drill retracts fully
chip_break = 0.1          # retract between pecks
# Through holes: the tip goes 0.5 mm past the bottom. Blind holes are drilled
# with the tip through the bottom, so they are full diameter to it and the point
# goes deeper; a bore's pre-drill stops at the hole bottom.
# (A blind bore over a narrower hole goes deeper: see conventions.md, Drill.)
through_breakthrough = 0.5
blind_breakthrough = 0.0

[thread]
direction = "climb"
# Radial passes 0.1 mm apart, for every size. carvera_cam.py makes as many as
# fit: the last pass runs the tool's centre on a helix of radius
# (modelled_hole + pitch_diameter_offset - thread mill diameter) / 2, and each
# earlier one 0.1 mm further in, down to a radius of zero (M2 3, M2.5 4, M3 4,
# M4 5 passes).
stepover = 0.1
top_offset = 0.0          # start at the hole top
# Bottom of the thread-mill pass, relative to the hole bottom: 0.3 mm past it
# in a through hole, inside the 0.5 mm the drill goes past it; at it in a blind
# hole, which ends there. A thread mill never goes deeper than the hole it
# threads, so it enters along a flat lead: a helical one starts below the
# bottom height.
through_bottom_offset = -0.3
blind_bottom_offset = 0.0


# ---------------------------------------------------------------- per size
#
#   pitch                   thread pitch
#   modelled_hole           the Hole command's minor diameter for the size
#   drill                   pre-drill, by its description in the tool library
#   thread_mill             thread mill, by its description in the tool library
#   pitch_diameter_offset   Fusion's "pitch diameter offset" for the thread mill

[M2]
pitch = 0.4
modelled_hole = 1.623
drill = "1.7*9.6mm Drill"
thread_mill = "Carvera M2 Threadmill"
pitch_diameter_offset = 0.5

["M2.5"]
pitch = 0.45
modelled_hole = 2.0755
drill = "2.2*8.8mm Drill"
thread_mill = "Carvera M2.5 Threadmill"
pitch_diameter_offset = 0.6

[M3]
# The lab's standard, confirmed 2026-10-12. (holes-for-copper-finger drilled
# 2.5 mm with a 0.5 mm offset; that is not the standard.)
pitch = 0.5
modelled_hole = 2.529
drill = "2.6*8.2mm Drill"
thread_mill = "Carvera M3 Threadmill"
pitch_diameter_offset = 0.6

[M4]
# No drill matches 3.332 mm, so the 3.175 mm drill opens the hole and the
# 3.175 mm end mill bores it to size before thread milling.
pitch = 0.7
modelled_hole = 3.332
drill = "3.175*7.4mm Drill (1/8\")"
thread_mill = "Carvera M4 Threadmill"
pitch_diameter_offset = 0.8

[M4.bore]
end_mill = "Spiral O Metal 3.175*12mm"
stepover = 0.1
passes = 1
through_bottom_offset = -0.5
# A blind hole gets a second, full-depth pass with the finishing end mill
# (eccosorb-clamp); a through hole in 1/8" plate gets the roughing pass only.
blind_finish_pass = true
